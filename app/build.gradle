plugins { alias(libs.plugins.android.application) }

def iqgeKeystorePath = System.getenv('IQGE_KEYSTORE')
def iqgeKeyAlias = System.getenv('IQGE_KEY_ALIAS') ?: 'iqge'
def iqgeKeystorePassword = System.getenv('IQGE_KEYSTORE_PASSWORD') ?: 'IQCodeLocalDev2026'

android {
    namespace 'com.iqge'
    compileSdk rootProject.ext.compileSdkVersion
    ndkVersion rootProject.ext.iqNdkVersion

    defaultConfig {
        applicationId 'com.iqge'
        minSdk rootProject.ext.minSdk
        targetSdk rootProject.ext.targetSdkVersion
        versionCode rootProject.ext.versionCode
        versionName rootProject.ext.versionName
        ndk { abiFilters 'arm64-v8a' }
    }

    sourceSets { main.java.exclude 'androidx/annotation/**' }

    signingConfigs {
        stableDev {
            storeFile file(iqgeKeystorePath ?: 'signing/iqge-local-dev.jks')
            storePassword iqgeKeystorePassword
            keyAlias iqgeKeyAlias
            keyPassword iqgeKeystorePassword
        }
    }
    buildTypes {
        debug { debuggable false; minifyEnabled false; signingConfig signingConfigs.stableDev }
        // release 开 R8 极致压缩（用户要求试验）：minify + 资源裁剪 + 激进规则；
        // 若要回退到“不混淆不裁剪”，把 minifyEnabled/shrinkResources 都翻回 false 即可。
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.stableDev
        }
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
    androidResources { noCompress 'zip' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { abortOnError false; checkReleaseBuilds false }
    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { outputFileName = "元境-${variant.buildType.name}.apk" }
    }
}

dependencies {
    implementation project(':Bcore')
    implementation files('libs/iqcode-termux-compat.jar')
    implementation files('libs/iqcode-zcode.jar')
    // 注解只在编译期用（CLASS 保留，运行时不需要）；版本对齐 shizuku 的运行时 1.3.0。
    compileOnly 'androidx.annotation:annotation:1.3.0'
    // Shizuku（https://github.com/RikkaApps/Shizuku）：无 Root 的 shell 权限。api 提供授权与调用，
    // provider 是管理端投递 Binder 的入口（需要 manifest 里声明 rikka.shizuku.ShizukuProvider）。
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
