apply plugin: 'com.android.library'

android {
    namespace 'top.niunaijun.blackbox'

    compileSdk rootProject.ext.compileSdkVersion


    aidlPackagedList "android/app/IServiceConnection.aidl"
    aidlPackagedList "android/accounts/IAccountManagerResponse.aidl"
    buildFeatures {
        aidl true
    }
    buildFeatures {
        prefab true
    }
    defaultConfig {
        minSdkVersion rootProject.ext.minSdk

        consumerProguardFiles "consumer-rules.pro"
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        ndkBuild {
            path 'src/main/cpp/Android.mk'
        }
        ndkVersion = rootProject.ext.iqNdkVersion
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    
    tasks.withType(JavaCompile) {
        options.compilerArgs << "-Xlint:-deprecation" << "-Xlint:-unchecked" << "-Xlint:-rawtypes"
        options.fork = true
        options.forkOptions.jvmArgs << "-Xmx2048m"
        // Slim: drop LineNumberTable/LocalVariableTable/SourceFile from BlackBox classes (dex shrink).
        options.debug = false
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
    lintOptions {

        checkReleaseBuilds false
        abortOnError false
        warningsAsErrors false
        disable "UnusedResources", 'RestrictedApi'
        textOutput "stdout"
        textReport false
        checkOnly 'NewApi', 'InlinedApi'
    }
}


// Strip the AIDL-generated "Using: ..." comment line which contains backslash sequences
// that Java's compiler mis-parses as Unicode escapes on Windows paths.
// Must run as the aidl task's doLast: doing it in javac's doFirst rewrites aidl's declared
// outputs, so aidl's output snapshot never matches and aidl+javac re-run on every build.
tasks.matching { it.name.startsWith('compileReleaseAidl') || it.name.startsWith('compileDebugAidl') }.all {
    doLast {
        def aidlOut = file("$buildDir/generated/aidl_source_output_dir")
        if (aidlOut.exists()) {
            aidlOut.eachFileRecurse { f ->
                if (f.name.endsWith('.java')) {
                    def content = f.text
                    if (content.contains(' * Using:')) {
                        content = content.replaceAll(/(?m)^ \* Using:.*$/, '')
                        f.text = content
                    }
                }
            }
        }
    }
}

tasks.withType(Javadoc) {
    options.addStringOption('Xdoclint:none', '-quiet')
    options.addStringOption('encoding', 'UTF-8')
    options.addStringOption('charSet', 'UTF-8')
}


dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar", "*.aar"])
    implementation(project(":black-reflection"))
    annotationProcessor(project(":compiler"))
    // androidx.core 全部用掉会拖进 lifecycle/coroutines/collection 等约 2000 个类；
    // Bcore 只用注解（CLASS 保留，运行时不需要），所以只留 compileOnly（版本对齐 shizuku 的 1.3.0）。
    compileOnly 'androidx.annotation:annotation:1.3.0'

    implementation 'com.github.tiann:FreeReflection:3.2.2'



    
}
